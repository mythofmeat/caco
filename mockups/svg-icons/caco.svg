<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>caco</title>
  <defs>
    <!-- hellfire tile background -->
    <radialGradient id="bg" cx="50%" cy="92%" r="85%">
      <stop offset="0" stop-color="#ff7a1f"/>
      <stop offset="0.28" stop-color="#c8240c"/>
      <stop offset="0.62" stop-color="#5a0a07"/>
      <stop offset="1" stop-color="#1c0504"/>
    </radialGradient>
    <linearGradient id="tileSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- bone horns -->
    <linearGradient id="horn" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#8f6a3e"/>
      <stop offset="0.55" stop-color="#e9d6ae"/>
      <stop offset="1" stop-color="#fff6e2"/>
    </linearGradient>

    <!-- gunmetal disk body -->
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#565c68"/>
      <stop offset="0.45" stop-color="#2b2f36"/>
      <stop offset="1" stop-color="#15171b"/>
    </linearGradient>

    <!-- brushed-steel shutter -->
    <linearGradient id="shutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa1ab"/>
      <stop offset="0.3" stop-color="#e3e7ec"/>
      <stop offset="0.55" stop-color="#b4bac3"/>
      <stop offset="1" stop-color="#7d848f"/>
    </linearGradient>

    <!-- molten label -->
    <linearGradient id="lava" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.45" stop-color="#ff8a1e"/>
      <stop offset="1" stop-color="#d4300a"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="tileClip">
      <rect x="24" y="24" width="464" height="464" rx="104"/>
    </clipPath>
  </defs>

  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)"/>
  <g clip-path="url(#tileClip)">
    <!-- faint floor grate -->
    <g stroke="#000" stroke-opacity="0.18" stroke-width="3">
      <path d="M24 420 H488 M24 448 H488 M24 476 H488"/>
    </g>
    <!-- embers -->
    <g fill="#ffb347">
      <circle cx="86" cy="330" r="5" opacity="0.8"/>
      <circle cx="112" cy="250" r="3" opacity="0.55"/>
      <circle cx="430" cy="300" r="4.5" opacity="0.75"/>
      <circle cx="404" cy="232" r="3" opacity="0.5"/>
      <circle cx="68" cy="410" r="3.5" opacity="0.7"/>
      <circle cx="446" cy="392" r="3" opacity="0.6"/>
      <circle cx="252" cy="70" r="3" opacity="0.35"/>
    </g>
  </g>
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#tileSheen)"/>
  <rect x="25.5" y="25.5" width="461" height="461" rx="102.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3"/>

  <!-- horns (drawn behind the disk so their bases tuck in) -->
  <g>
    <path d="M150 186 C94 164 70 104 124 46 C104 100 140 136 218 166 Z" fill="url(#horn)"/>
    <path d="M362 186 C418 164 442 104 388 46 C408 100 372 136 294 166 Z" fill="url(#horn)"/>
    <!-- growth ridges -->
    <g fill="none" stroke="#7a5630" stroke-opacity="0.45" stroke-width="4" stroke-linecap="round">
      <path d="M98 136 C110 130 122 134 130 144"/>
      <path d="M96 102 C104 98 112 100 118 108"/>
      <path d="M414 136 C402 130 390 134 382 144"/>
      <path d="M416 102 C408 98 400 100 394 108"/>
    </g>
  </g>

  <!-- disk shadow -->
  <ellipse cx="256" cy="404" rx="128" ry="16" fill="#000" opacity="0.4" filter="url(#soft)"/>

  <!-- disk body with chamfered corner -->
  <path d="M160 150 H342 L378 186 V366 Q378 392 352 392 H160 Q134 392 134 366 V176 Q134 150 160 150 Z"
        fill="url(#disk)" stroke="#7b8391" stroke-opacity="0.55" stroke-width="3"/>

  <!-- shutter -->
  <path d="M190 150 H322 V222 Q322 234 310 234 H202 Q190 234 190 222 Z" fill="url(#shutter)"/>
  <rect x="270" y="164" width="32" height="54" rx="5" fill="#1b1d22"/>
  <path d="M190 150 H322" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>

  <!-- write-protect holes -->
  <rect x="146" y="360" width="14" height="18" rx="3" fill="#0c0d10"/>
  <rect x="352" y="360" width="14" height="18" rx="3" fill="#0c0d10"/>

  <!-- molten label -->
  <rect x="168" y="256" width="176" height="116" rx="12" fill="url(#lava)" filter="url(#glow)"/>
  <rect x="169.5" y="257.5" width="173" height="113" rx="10.5" fill="none" stroke="#fff3c4" stroke-opacity="0.6" stroke-width="3"/>

  <!-- flame glyph -->
  <path d="M256 272
           C262 294 290 306 288 334
           C286 354 272 364 256 364
           C238 364 224 352 224 334
           C224 318 234 308 240 298
           C242 312 248 320 256 322
           C250 306 250 288 256 272 Z"
        fill="#5c0d06"/>
  <path d="M258 318
           C262 330 272 336 270 346
           C268 354 262 358 256 358
           C248 358 242 352 243 344
           C244 336 250 332 252 326
           C254 332 256 334 258 334
           C256 328 256 324 258 318 Z"
        fill="#ffcf5a"/>
</svg>
