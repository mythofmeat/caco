<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>caco</title>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d434c"/>
      <stop offset="0.55" stop-color="#262a30"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <radialGradient id="hellglow" cx="128" cy="150" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5a1f" stop-opacity="0.6"/>
      <stop offset="0.45" stop-color="#b3200e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b3200e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rivet" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#b9c0c9"/>
      <stop offset="0.5" stop-color="#6b727c"/>
      <stop offset="1" stop-color="#2a2e34"/>
    </radialGradient>
    <linearGradient id="topface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a727d"/>
      <stop offset="1" stop-color="#3e444c"/>
    </linearGradient>
    <linearGradient id="topfaceHot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e6a6a"/>
      <stop offset="1" stop-color="#4a3a36"/>
    </linearGradient>
    <linearGradient id="leftface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#343941"/>
      <stop offset="1" stop-color="#23272c"/>
    </linearGradient>
    <linearGradient id="rightface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23272c"/>
      <stop offset="1" stop-color="#16191d"/>
    </linearGradient>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur3" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur1" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <clipPath id="panelclip">
      <rect x="12" y="12" width="232" height="232" rx="44"/>
    </clipPath>
  </defs>

  <!-- Base panel -->
  <rect x="12" y="14" width="232" height="232" rx="44" fill="#000" opacity="0.35" filter="url(#blur3)"/>
  <rect x="12" y="12" width="232" height="232" rx="44" fill="url(#panel)"/>
  <g clip-path="url(#panelclip)">
    <rect x="12" y="12" width="232" height="232" fill="url(#hellglow)"/>
    <path d="M12 212 H244" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M12 214 H244" stroke="#fff" stroke-opacity="0.05" stroke-width="1"/>
  </g>
  <rect x="13.5" y="13.5" width="229" height="229" rx="42.5" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="1.5"/>
  <rect x="12" y="12" width="232" height="232" rx="44" fill="none" stroke="#0a0b0d" stroke-width="2"/>

  <!-- Rivets -->
  <circle cx="38" cy="38" r="6" fill="url(#rivet)" stroke="#121417" stroke-width="1.5"/>
  <circle cx="218" cy="38" r="6" fill="url(#rivet)" stroke="#121417" stroke-width="1.5"/>
  <circle cx="38" cy="226" r="6" fill="url(#rivet)" stroke="#121417" stroke-width="1.5"/>
  <circle cx="218" cy="226" r="6" fill="url(#rivet)" stroke="#121417" stroke-width="1.5"/>

  <g transform="translate(128 132) scale(1.12) translate(-128 -130)">
  <!-- Stack shadow -->
  <ellipse cx="128" cy="200" rx="72" ry="16" fill="#000" opacity="0.55" filter="url(#blur6)"/>

  <!-- Bottom slab (blue) -->
  <path d="M68 148 L128 182 L128 196 L68 162 Z" fill="url(#leftface)"/>
  <path d="M128 182 L188 148 L188 162 L128 196 Z" fill="url(#rightface)"/>
  <path d="M68 148 L128 114 L188 148 L128 182 Z" fill="url(#topface)" stroke="#8b949f" stroke-width="1.2" stroke-linejoin="round"/>
  <polyline points="68,155 128,189 188,155" fill="none" stroke="#3f8cff" stroke-width="5" opacity="0.6" filter="url(#blur1)"/>
  <polyline points="68,155 128,189 188,155" fill="none" stroke="#6fb0ff" stroke-width="2.4"/>

  <!-- Middle slab (yellow) -->
  <path d="M68 122 L128 156 L128 170 L68 136 Z" fill="url(#leftface)"/>
  <path d="M128 156 L188 122 L188 136 L128 170 Z" fill="url(#rightface)"/>
  <path d="M68 122 L128 88 L188 122 L128 156 Z" fill="url(#topface)" stroke="#8b949f" stroke-width="1.2" stroke-linejoin="round"/>
  <polyline points="68,129 128,163 188,129" fill="none" stroke="#ffc233" stroke-width="5" opacity="0.6" filter="url(#blur1)"/>
  <polyline points="68,129 128,163 188,129" fill="none" stroke="#ffd46b" stroke-width="2.4"/>

  <!-- Top slab (red) -->
  <path d="M68 96 L128 130 L128 144 L68 110 Z" fill="url(#leftface)"/>
  <path d="M128 130 L188 96 L188 110 L128 144 Z" fill="url(#rightface)"/>
  <path d="M68 96 L128 62 L188 96 L128 130 Z" fill="url(#topfaceHot)" stroke="#a39690" stroke-width="1.2" stroke-linejoin="round"/>
  <polyline points="68,103 128,137 188,103" fill="none" stroke="#ff3b2f" stroke-width="5" opacity="0.7" filter="url(#blur1)"/>
  <polyline points="68,103 128,137 188,103" fill="none" stroke="#ff6a4d" stroke-width="2.4"/>

  <!-- Glowing "c" rune lying flat on the top slab -->
  <g transform="matrix(0.6,-0.34,0.6,0.34,68,96)">
    <path d="M52.61 79.89 A30 30 0 1 1 79.89 52.61" fill="none" stroke="#ff3a12" stroke-width="22" stroke-linecap="round" opacity="0.75" filter="url(#blur3)"/>
    <path d="M52.61 79.89 A30 30 0 1 1 79.89 52.61" fill="none" stroke="#ff7a1a" stroke-width="13" stroke-linecap="round"/>
    <path d="M52.61 79.89 A30 30 0 1 1 79.89 52.61" fill="none" stroke="#ffe08a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <ellipse cx="128" cy="92" rx="34" ry="16" fill="#ff5a1f" opacity="0.28" filter="url(#blur6)"/>

  <!-- Embers -->
  <g opacity="0.8" filter="url(#blur1)" fill="#ff5a1f">
    <circle cx="112" cy="54" r="4"/>
    <circle cx="143" cy="46" r="3.4"/>
    <circle cx="127" cy="34" r="2.8"/>
    <circle cx="156" cy="62" r="3"/>
    <circle cx="99" cy="42" r="2.4"/>
  </g>
  <g fill="#ffb347">
    <circle cx="112" cy="54" r="2.2"/>
    <circle cx="143" cy="46" r="1.8"/>
    <circle cx="127" cy="34" r="1.4" fill="#ffd27a"/>
    <circle cx="156" cy="62" r="1.6"/>
    <circle cx="99" cy="42" r="1.2" fill="#ffd27a"/>
  </g>
  </g>
</svg>
