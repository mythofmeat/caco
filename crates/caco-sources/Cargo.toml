[package]
name = "caco-sources"
version.workspace = true
edition.workspace = true

[dependencies]
caco-core.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
cc.workspace = true
regex.workspace = true
html-escape.workspace = true
unicode-normalization.workspace = true
urlencoding.workspace = true
rusqlite.workspace = true

# The maintainer's tool for the year's Cacowards data, not something the app
# ships: an example so `cargo build` skips it and `cargo test` keeps it compiling,
# without a crate of its own for every release to build. `test = true` because
# examples do not run their tests otherwise, and it has a parser to pin.
[[example]]
name = "cacowards_draft"
path = "examples/cacowards_draft/main.rs"
test = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true
http.workspace = true
# Builds the idgames-shaped zips an import test reads.
zip.workspace = true
