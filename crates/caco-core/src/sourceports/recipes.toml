# Built-in sourceport build recipes.
#
# A file dropped in the recipe directory (see
# `config::sourceport_recipe_dir`) is merged over this set by name, so a user
# can pin a ref, add build args or attach patches without patching the binary.

[nyan-doom]
repo = "https://github.com/andrikpowell/nyan-doom"
ref = "master"
# The cmake root is not the repo root for this project.
source_subdir = "prboom2"
binary = "nyan-doom"

[nyan-doom.build]
system = "cmake"
generator = "Ninja"
args = ["-DCMAKE_BUILD_TYPE=Release"]
install = true

[nyan-doom.deps]
arch = [
    "cmake", "ninja", "pkgconf", "libxmp", "fluidsynth", "libmad", "portmidi",
    "sdl2-compat", "sdl2_image", "sdl2_mixer", "libvorbis", "libsndfile",
    "libzip", "glu", "mesa",
]
# zlib-ng-compat-static because the CMake config zlib-ng-compat-devel ships
# names libz.a, and nyan-doom's find_package(ZLIB) dies at configure without it.
fedora = [
    "gcc-c++", "cmake", "ninja-build", "pkgconf-pkg-config",
    "libxmp-devel", "fluidsynth-devel", "libmad-devel", "portmidi-devel",
    "sdl2-compat-devel", "SDL2_image-devel", "SDL2_mixer-devel",
    "libvorbis-devel", "libsndfile-devel", "libzip-devel", "mesa-libGLU-devel",
    "mesa-libGL-devel", "zlib-ng-compat-static",
]

[uzdoom]
repo = "https://github.com/UZDoom/uzdoom"
# Not "master" — uzdoom's default branch is trunk, and the per-version
# branches (4.14.3, 2.6, ...) are what tags would be elsewhere.
ref = "trunk"
binary = "uzdoom"

[uzdoom.build]
system = "cmake"
generator = "Ninja"
# -DINSTALL_PK3_PATH=bin is load-bearing and must not be dropped. uzdoom's
# default install puts the five pk3s in share/games/uzdoom while progdir (with
# SYSTEMINSTALL off, the default) looks beside the executable, so the stock
# install builds fine and then aborts at launch with "Cannot find uzdoom.pk3".
# Installing the pk3s into bin/ fixes that without baking an absolute path the
# way -DSYSTEMINSTALL=ON would, which is what keeps the prefix relocatable.
args = ["-DCMAKE_BUILD_TYPE=Release", "-DINSTALL_PK3_PATH=bin"]
install = true

[uzdoom.deps]
# glib2 for the fluidsynth bundled inside ZMusic, whose configure requires
# glib-2.0 and stops without it.
arch = [
    "cmake", "ninja", "openal", "sdl2-compat", "libwebp", "bzip2", "libvpx",
    "waylandpp", "zlib", "glib2",
]
fedora = [
    "gcc-c++", "cmake", "ninja-build", "openal-soft-devel", "sdl2-compat-devel",
    "libwebp-devel", "bzip2-devel", "libvpx-devel", "waylandpp-devel",
    "zlib-ng-compat-devel", "glib2-devel",
]
