[package]
name = "caco"
version.workspace = true
edition.workspace = true

[[bin]]
name = "caco"
path = "src/main.rs"

[dependencies]
caco-core.workspace = true
caco-sources.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
rusqlite.workspace = true
chrono.workspace = true
image.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
rfd.workspace = true
dirs.workspace = true
open.workspace = true
shlex.workspace = true

[build-dependencies]
# Rasterises assets/caco.svg into the window icon. The icon has no text or
# embedded images, so the font stack behind the default features is dead weight.
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }
tempfile.workspace = true
