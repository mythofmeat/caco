name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The workspace sets no [lints] table, so without -D warnings clippy reports and passes.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  homebrew:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v7
      - run: echo /home/linuxbrew/.linuxbrew/bin >>"$GITHUB_PATH"
      # brew style and audit only apply the formula rules to a tapped formula, so the checkout is linked in as the mythofmeat/caco tap.
      - run: |
          mkdir -p "$(brew --repository)/Library/Taps/mythofmeat"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/mythofmeat/homebrew-caco"
      - run: brew style mythofmeat/caco/caco
      - run: brew audit --strict mythofmeat/caco/caco
