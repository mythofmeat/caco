name: verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # makepkg and rpmbuild export CFLAGS with -O2 and the package jobs build under it; a plain cargo
    # run exports none. Without this, a C dependency that breaks under optimisation flags passes here
    # and fails only after the release has already pushed its tag (v4.1.6, aws-lc-sys + cc 1.6).
    env:
      CFLAGS: -O2
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update && rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The workspace sets no [lints] table, so without -D warnings clippy reports and passes.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Whether a row fits its panel is decided at paint time, so rendering every surface is the only
  # test of it. Being in verify is what makes it gate update-deps' auto-merge: egui 0.37 broke this
  # harness and nothing noticed, because nothing ran it.
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - uses: Swatinem/rust-cache@v2
      # The runner has no GPU. lavapipe, Mesa's software Vulkan driver, is what egui_kittest would
      # pick over one anyway.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
      - run: cargo test -p caco --test screenshots -- --ignored --nocapture
      # main.rs's min_inner_size, and the size dialogs actually break at. A failure at the default
      # size says nothing about this one, so it runs either way.
      - if: ${{ !cancelled() }}
        run: cargo test -p caco --test screenshots -- --ignored --nocapture
        env:
          CACO_SHOT_SIZE: 800x400
      # The main surfaces against the images committed beside the test. A change here holds back
      # a dependency update that would otherwise merge and release with nobody looking at it.
      - if: ${{ !cancelled() }}
        run: cargo test -p caco --test snapshots -- --ignored --nocapture
      # A failed run is when the shots are most wanted.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: target/screenshots/
      # What it looks like now and what differs, to look at and, if it is right, to commit.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-changes
          path: |
            crates/caco/tests/snapshots/*.new.png
            crates/caco/tests/snapshots/*.diff.png
          if-no-files-found: ignore

  homebrew:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # The runner image's brew lags; audit against the brew users install with, which is the one
      # that knows postflight_steps and rejects the legacy postflight block.
      - run: brew update
      # brew style and audit only apply the cask rules to a tapped cask, so the checkout is linked in as the mythofmeat/caco tap.
      - run: |
          mkdir -p "$(brew --repository)/Library/Taps/mythofmeat"
          ln -s "$GITHUB_WORKSPACE" "$(brew --repository)/Library/Taps/mythofmeat/homebrew-caco"
      # Homebrew 7 refuses to load anything from an untrusted third-party tap, and audit has to load
      # the cask (style only lints the file, which is why it kept passing). Trust the one cask rather
      # than the tap: installing the fully qualified name grants users exactly that, so the audit runs
      # under the same trust a real install has.
      - run: brew trust --cask mythofmeat/caco/caco
      - run: brew style --cask mythofmeat/caco/caco
      - run: brew audit --cask --strict mythofmeat/caco/caco
