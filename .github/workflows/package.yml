name: package

# The release workflow builds its packages here. Pull requests that change the packaging build them too, since
# nothing else would catch a broken recipe before a release.
on:
  pull_request:
    paths:
      - .github/workflows/package.yml
      - contrib/**
      - assets/caco.desktop
      - assets/caco.svg
  workflow_call:
    inputs:
      ref:
        description: Tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  # makepkg clones the tag matching the PKGBUILD's pkgver, so on a pull request this builds the last release with
  # the changed recipe, not the pull request's code.
  arch:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm git
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # makepkg refuses to run as root, and makepkg --syncdeps installs the build dependencies with sudo.
      - run: |
          useradd --create-home builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - run: |
          mkdir /build
          cp contrib/arch/PKGBUILD /build/
          chown -R builder /build
          cd /build
          sudo -u builder makepkg --syncdeps --noconfirm
      - uses: actions/upload-artifact@v7
        with:
          name: arch
          path: /build/*.pkg.tar.zst

  # The Fedora package is for the Asahi MacBook. Fedora 43 builds one that installs on 43 and anything newer.
  fedora:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    container: fedora:43
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git rpm-build gcc desktop-file-utils rustup
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - run: |
          rustup-init -y --profile minimal
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
      # rpmbuild files each package under an architecture directory, which the release would attach as a directory.
      - run: |
          version=$(sed -n 's/^Version: *//p' contrib/fedora/caco.spec)
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --prefix="caco-$version/" -o "caco-$version.tar.gz" HEAD
          rpmbuild -bb contrib/fedora/caco.spec --define "_sourcedir $PWD" --define "_rpmdir $PWD/rpms" \
            --define "_build_name_fmt %%{NAME}-%%{VERSION}-%%{RELEASE}.%%{ARCH}.rpm"
      - uses: actions/upload-artifact@v7
        with:
          name: fedora
          path: rpms/*.rpm
