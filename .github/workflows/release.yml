name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The tag is the only version source, so it is validated once and handed to
  # every builder rather than re-derived per job.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      package_version: ${{ steps.derive.outputs.package_version }}
    steps:
      - id: derive
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_version=${version//-/_}" >> "$GITHUB_OUTPUT"

  arch:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - run: |
            docker build \
              --build-arg VERSION="${{ needs.version.outputs.version }}" \
              --build-arg PACKAGE_VERSION="${{ needs.version.outputs.package_version }}" \
              --target artifacts \
              --output type=local,dest=out \
              -f contrib/arch/Dockerfile \
              .

      - uses: actions/upload-artifact@v7
        with:
          name: packages-arch
          path: out/*
          if-no-files-found: error

  macos:
    needs: version
    # macos-15 is arm64. An Intel Mac needs the x86_64 runner instead, or a
    # universal build: compile both targets and `lipo -create` them.
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # GitHub bills macOS minutes at 10x, and the release profile is tuned for
      # size over build time (fat LTO, one codegen unit, opt-level "z"). These
      # three overrides cut the compile roughly in half at the cost of a larger
      # binary. Delete them to ship what the Arch package ships.
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: '2'
    steps:
      - uses: actions/checkout@v7

      # Same injection the Arch Dockerfile does, so the binary's own version
      # string and Info.plist agree with the tag.
      - run: sed -i '' "s/^version = \"0.0.0\"/version = \"$VERSION\"/" Cargo.toml

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release -p caco

      # No `cargo test` here: the Arch job already gates the tag on a green
      # suite, and running it twice doubles the expensive half of the bill.
      # Nothing macOS-specific is covered as a result.
      - run: contrib/macos/bundle.sh

      - run: ditto -c -k --keepParent dist/Caco.app "dist/Caco-$VERSION-macos-arm64.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    needs: [arch, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true

      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes out/*
        env:
          GH_TOKEN: ${{ github.token }}
