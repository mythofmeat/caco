name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  version:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Releases are cut from main, not $GITHUB_REF."
            exit 1
          fi
          versions() {
            sed -n '/^\[workspace\.package\]$/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml
            sed -n '/^name = "caco\(-core\|-sources\)\?"$/{n;s/^version = "\(.*\)"$/\1/p}' Cargo.lock
            sed -n 's/^pkgver=//p' contrib/arch/PKGBUILD
            sed -n 's/^Version: *//p' contrib/fedora/caco.spec
          }
          current=$(versions | sort -u)
          if [ "$(printf '%s\n' "$current" | wc -l)" -ne 1 ]; then
            echo "::error::The version files disagree: $(versions | tr '\n' ' ')"
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          sed -i "/^\[workspace\.package\]$/,/^\[/s/^version = \".*\"$/version = \"$version\"/" Cargo.toml
          sed -i "/^name = \"caco\(-core\|-sources\)\?\"$/{n;s/^version = .*/version = \"$version\"/}" Cargo.lock
          sed -i -e "s/^pkgver=.*/pkgver=$version/" -e "s/^pkgrel=.*/pkgrel=1/" contrib/arch/PKGBUILD
          sed -i -e "s/^\(Version: *\).*/\1$version/" -e "s/^\(Release: *\)[0-9]*/\11/" contrib/fedora/caco.spec
          if [ "$(versions | sort -u)" != "$version" ]; then
            echo "::error::Not every version file moved to $version."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v$version"
          git tag "v$version"
          git push --atomic origin HEAD "refs/tags/v$version"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"

  packages:
    needs: version
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.version.outputs.tag }}

  release:
    needs: [version, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - run: gh release create "$TAG" assets/* --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}

