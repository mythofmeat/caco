[workspace]
members = [
    "crates/caco-core",
    "crates/caco",
]
resolver = "3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[workspace.package]
# Placeholder. The real version comes from the release tag: contrib/arch/Dockerfile
# rewrites this line at package time, so a build from a working tree reports 0.0.0.
version = "0.0.0"
publish = false
edition = "2024"
description = "Doom WAD library manager"
authors = ["eshen"]

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# Database
rusqlite = { version = "0.40", features = ["bundled"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# System paths
dirs = "6"

# Concurrency
arc-swap = "1"

# Text processing
regex = "1"
shlex = "2"

# Hashing / binary
md-5 = "0.11"
byteorder = "1"
hex = "0.4"

# Image processing
image = { version = "0.25", default-features = false, features = ["png"] }

# Archive
zip = { version = "8", default-features = false, features = ["deflate"] }

# HTTP
# `query` became opt-in in 0.13; it was unconditional in 0.12. The idgames and
# Doom Wiki clients both build their requests with `RequestBuilder::query`.
reqwest = { version = "0.13", features = ["json", "blocking", "query"] }

# Text processing (sources)
html-escape = "0.2"
unicode-normalization = "0.1"
urlencoding = "2"

# GUI
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["syntect"] }
rfd = "0.17"
open = "5"

# Testing
tempfile = "3"

tracing = "0.1"

# Internal crates. Deliberately no `version` alongside `path`: nothing here is
# published (workspace.package sets publish = false), and a version requirement
# would have to be rewritten in lockstep with the tag-injected workspace version
# or cargo would refuse to resolve the path dependency against it.
caco-core = { path = "crates/caco-core" }
caco-sources = { path = "crates/caco-sources" }
