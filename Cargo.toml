[workspace]
members = [
    "crates/caco-core",
    "crates/caco",
]
resolver = "3"

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[workspace.package]
version = "3.4.0"
edition = "2024"
description = "Doom WAD library manager"
authors = ["eshen"]

[profile.release]
strip = true
opt-level = "z"
lto = "fat"
codegen-units = 1

[workspace.dependencies]
# Error handling
thiserror = "2"
anyhow = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# System paths
dirs = "6"

# Concurrency
arc-swap = "1"

# Text processing
regex = "1"
shlex = "1"

# Hashing / binary
md-5 = "0.10"
byteorder = "1"
hex = "0.4"

# Image processing
image = { version = "0.25", default-features = false, features = ["png"] }

# Archive
zip = { version = "2", default-features = false, features = ["deflate"] }

# HTTP
reqwest = { version = "0.12", features = ["json", "blocking"] }

# Text processing (sources)
html-escape = "0.2"
unicode-normalization = "0.1"
urlencoding = "2"

# GUI
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["syntect"] }
rfd = "0.15"
open = "5"

# Testing
tempfile = "3"

tracing = "0.1"

# Internal crates. The `version` field is needed alongside `path` for
# `cargo package --workspace` to work at all — without it cargo errors with
# "dependency X does not specify a version". These must stay equal to
# workspace.package.version; the release script rewrites them together with
# workspace.package.version on every bump and aborts if any reference is left
# behind.
caco-core = { path = "crates/caco-core", version = "3.4.0" }
caco-sources = { path = "crates/caco-sources", version = "3.4.0" }
